name: template-modular-dev

services:
  # ============================================================================
  # PostgreSQL Database (Dev)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: template_pg_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-laravel_dev}
      POSTGRES_USER: ${DB_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-laravel} -d ${DB_DATABASE:-laravel_dev}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - dev-network

  # ============================================================================
  # Laravel 12 Backend - PHP 8.3 FPM (Dev)
  # ============================================================================
  back-app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: template_app_dev
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:Ug+6/840qtPoAwyWXlpzxIq92Q+74DBOqraaDScNfdM=}
      JWT_SECRET: ${JWT_SECRET:-default-fallback-jwt-secret-key-at-least-32-bytes!}
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://api.localhost}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-laravel_dev}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: array
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - ./back-laravel:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-network

  # ============================================================================
  # Nginx Gateway / Web Server (Dev: http://localhost y http://api.localhost)
  # ============================================================================
  back-web:
    image: nginx:alpine
    container_name: template_web_dev
    restart: unless-stopped
    ports:
      - "${BACK_PORT:-80}:80"
    volumes:
      - ./back-laravel:/var/www/html:ro
      - ./docker/nginx/default.dev.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - back-app
    networks:
      - dev-network

  # ============================================================================
  # Laravel Queue Worker (Dev)
  # ============================================================================
  back-queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: template_queue_dev
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3 --max-time=3600
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:Ug+6/840qtPoAwyWXlpzxIq92Q+74DBOqraaDScNfdM=}
      JWT_SECRET: ${JWT_SECRET:-default-fallback-jwt-secret-key-at-least-32-bytes!}
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://api.localhost}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-laravel_dev}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: array
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - ./back-laravel:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-network

  # ============================================================================
  # Laravel Task Scheduler (Dev)
  # ============================================================================
  back-scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: template_scheduler_dev
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      APP_NAME: ${APP_NAME:-Laravel}
      APP_ENV: local
      APP_KEY: ${APP_KEY:-base64:Ug+6/840qtPoAwyWXlpzxIq92Q+74DBOqraaDScNfdM=}
      JWT_SECRET: ${JWT_SECRET:-default-fallback-jwt-secret-key-at-least-32-bytes!}
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://api.localhost}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-laravel_dev}
      DB_USERNAME: ${DB_USERNAME:-laravel}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      SESSION_DRIVER: array
      QUEUE_CONNECTION: database
      CACHE_STORE: database
    volumes:
      - ./back-laravel:/var/www/html
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dev-network

volumes:
  pgdata_dev:

networks:
  dev-network:
    driver: bridge
