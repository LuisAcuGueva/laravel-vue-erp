map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ==============================================================================
# 1. Backend Laravel API (http://api.localhost)
# ==============================================================================
server {
    listen 80;
    server_name api.localhost;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass back-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}

# ==============================================================================
# 2. Frontend Vue / Vite Dev Server (http://localhost)
# ==============================================================================
server {
    listen 80 default_server;
    server_name localhost 127.0.0.1;

    client_max_body_size 64M;

    # Rutas directas de API o Sanctum si se invocan sobre localhost
    location ~ ^/(api|sanctum|up) {
        root /var/www/html/public;
        fastcgi_pass back-app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300s;
    }

    # Todo el resto va al Vite dev server en el host
    location / {
        proxy_pass http://host.docker.internal:5174;
        proxy_http_version 1.1;

        # WebSocket HMR
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
    }
}
