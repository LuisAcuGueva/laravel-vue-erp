name: template-modular-test

services:
  # ============================================================================
  # Dedicated PostgreSQL Database (Testing)
  # ============================================================================
  postgres-test:
    image: postgres:16-alpine
    container_name: template_pg_test
    environment:
      POSTGRES_DB: ${DB_TEST_DATABASE:-laravel_test}
      POSTGRES_USER: ${DB_TEST_USERNAME:-laravel}
      POSTGRES_PASSWORD: ${DB_TEST_PASSWORD:-secret}
    ports:
      - "${DB_TEST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_TEST_USERNAME:-laravel} -d ${DB_TEST_DATABASE:-laravel_test}"]
      interval: 2s
      timeout: 2s
      retries: 10
    networks:
      - test-network

  # ============================================================================
  # Laravel Test Runner Container
  # ============================================================================
  back-test:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: template_app_test
    environment:
      APP_ENV: testing
      APP_KEY: ${APP_KEY:-base64:Ug+6/840qtPoAwyWXlpzxIq92Q+74DBOqraaDScNfdM=}
      DB_CONNECTION: pgsql
      DB_HOST: postgres-test
      DB_PORT: 5432
      DB_DATABASE: ${DB_TEST_DATABASE:-laravel_test}
      DB_USERNAME: ${DB_TEST_USERNAME:-laravel}
      DB_PASSWORD: ${DB_TEST_PASSWORD:-secret}
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
    volumes:
      - ./back-laravel:/var/www/html
    depends_on:
      postgres-test:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/entrypoint-test.sh"]
    networks:
      - test-network

networks:
  test-network:
    driver: bridge
